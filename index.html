<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Learning Portal - Poonam Sachdeva</title>
<style>
body{font-family:'Segoe UI', sans-serif; background:#f0f8ff; margin:0; padding:0; text-align:center}
.header{background:linear-gradient(90deg,#6a11cb,#2575fc); color:white; padding:20px}
.grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:15px; padding:20px; max-width:900px; margin:auto}
.card{background:white; border-radius:15px; padding:20px; box-shadow:0 4px 10px rgba(0,0,0,0.1); cursor:pointer; transition:0.3s; font-weight:bold; font-size:16px}
.card:hover{transform:scale(1.05); background:#eef2ff}
.back-btn{background:#ff6b6b; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer; margin:15px; font-size:14px}
.folder{background:#fffde7; border:2px dashed #ffb300}
.activity{background:#e8f5e9; border:2px solid #4caf50}
video{width:90%; max-width:400px; border-radius:15px; margin-top:10px; border:3px solid #2575fc}
#result{font-size:20px; font-weight:bold; margin:15px; color:#2e7d32}
#formula{background:white; max-width:400px; margin:10px auto; padding:15px; border-radius:10px; text-align:left; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
</style>
</head>
<body>
<div class="header"><h1>Smart Learning Portal</h1><p>By Poonam Sachdeva | Class 1 to 10</p></div>
<div id="app"></div>

<script>
let currentClass = 0;
let subjects = ["Maths","Science","SST","English","Punjabi","Hindi"];

function showClasses(){
 document.getElementById('app').innerHTML = `<h2>Select Your Class</h2><div class="grid">` + [...Array(10)].map((_,i)=>`<div class="card" onclick="showSubjects(${i+1})">Class ${i+1}</div>`).join('') + `</div>`;
}

function showSubjects(cls){
 currentClass = cls;
 document.getElementById('app').innerHTML = `<button class="back-btn" onclick="showClasses()">⬅ Back to Classes</button><h2>Class ${cls} - Subjects</h2><div class="grid">` + subjects.map(s=>`<div class="card" onclick="openSubject('${s}')">${s}</div>`).join('') + `</div>`;
}

function openSubject(sub){
 if(sub!== 'Maths'){
   document.getElementById('app').innerHTML = `<button class="back-btn" onclick="showSubjects(${currentClass})">⬅ Back</button><h2>Class ${currentClass} - ${sub}</h2><p>Activities Coming Soon...</p>`;
   return;
 }
 if(currentClass >= 5){
   openMathsFolder();
 } else {
   document.getElementById('app').innerHTML = `<button class="back-btn" onclick="showSubjects(${currentClass})">⬅ Back</button><h2>Class ${currentClass} - Maths</h2><p>Junior Classes ke liye Basic Maths jaldi ayengi...</p>`;
 }
}

// Aapka pehla folder - Maths
function openMathsFolder(){
 document.getElementById('app').innerHTML = `
 <button class="back-btn" onclick="showSubjects(${currentClass})">⬅ Back</button>
 <h2>Class ${currentClass} - Maths</h2>
 <div class="grid">
   <div class="card folder" onclick="openActivitiesFolder()">📁 Maths Activities Folder<br><small>Click to Open</small></div>
 </div>`;
}

// Aapka dusra folder - Activities Folder - Yahan aap aage aur activities add karoge
function openActivitiesFolder(){
 document.getElementById('app').innerHTML = `
 <button class="back-btn" onclick="openMathsFolder()">⬅ Back to Maths</button>
 <h2>Class ${currentClass} - Maths Activities</h2>
 <div class="grid">
   <div class="card activity" onclick="openShapeDetector()">📐 2D Shape Detector<br><small>Area & Perimeter</small></div>
   <div class="card activity" onclick="alert('Yahan aapki agli activity ayegi')">➕ More Activities</div>
 </div>`;
}

// Aapka hi wala Shape Detector + Formula wala code - Kuch change nahi kiya
function openShapeDetector(){
 document.getElementById('app').innerHTML = `
 <button class="back-btn" onclick="openActivitiesFolder()">⬅ Back to Folder</button>
 <h2>📐 2D Shape Detector - Class ${currentClass}</h2>
 <button onclick="startCamera()" style="padding:12px 20px;background:#2575fc;color:white;border:none;border-radius:10px;cursor:pointer">📷 Start Camera</button>
 <br><video id="video" autoplay playsinline></video>
 <canvas id="canvas" style="display:none"></canvas>
 <div id="result">Camera start karke shape dikhao</div>
 <div id="formula"></div>
 `;
}

async function startCamera(){
 try{
   const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
   document.getElementById('video').srcObject = stream;
   detectLoop();
 } catch(e){ alert("Camera permission de do"); }
}

function detectLoop(){
 const formulas = {
   "Circle ⭕": "Area = πr² <br> Perimeter = 2πr <br><br><b>Example:</b> r=7cm to Area=154cm²",
   "Square ⬜": "Area = side² <br> Perimeter = 4 × side <br><br><b>Example:</b> side=5cm to Area=25cm²",
   "Rectangle ▭": "Area = l × b <br> Perimeter = 2(l+b) <br><br><b>Example:</b> l=10, b=6 to Area=60cm²",
   "Triangle 🔺": "Area = ½ × base × height <br> Perimeter = a+b+c <br><br><b>Example:</b> b=10,h=8 to Area=40cm²"
 };
 const shapes = Object.keys(formulas);
 setInterval(()=>{
   let r = shapes[Math.floor(Math.random()*shapes.length)];
   if(document.getElementById('result')){
     document.getElementById('result').innerText = "Detected: " + r;
     document.getElementById('formula').innerHTML = "<b>"+r+"</b><br>"+formulas[r];
   }
 },2500);
}

showClasses();
</script>
</body>
</html>
