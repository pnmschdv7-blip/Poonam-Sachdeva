<!DOCTYPE html>
<html>
<head><title>Final Project</title>
<style>
body{text-align:center; font-family:Arial;}
#webcam-container canvas{border:5px solid black; border-radius:10px;}
#formula{background:#ffff99; border:3px solid black; padding:15px; margin:15px auto; width:90%; max-width:500px; font-size:20px; font-weight:bold;}
#label{font-size:22px; color:blue; font-weight:bold; margin:10px;}
button{padding:12px 20px; background:green; color:white; font-size:16px; border:none; border-radius:6px;}
</style>
</head>
<body>
<h2>Shape Detector</h2>
<button onclick="init()">Start Camera</button>
<div id="webcam-container"></div>
<div id="label"></div>
<div id="formula">Start dabao fir shape dikhao</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
const URL = "https://teachablemachine.withgoogle.com/models/bFbw77Ikk/";
let model, webcam;
async function init(){
  model = await tmImage.load(URL+"model.json", URL+"metadata.json");
  webcam = new tmImage.Webcam(350,350,true);
  await webcam.setup(); await webcam.play();
  document.getElementById("webcam-container").appendChild(webcam.canvas);
  loop();
}
async function loop(){
  webcam.update();
  const prediction = await model.predict(webcam.canvas);
  let best = prediction[0];
  for(let p of prediction) if(p.probability > best.probability) best = p;

  let per = (best.probability*100).toFixed(0);
  document.getElementById("label").innerHTML = best.className.toUpperCase()+" : "+per+"%";

  let f = document.getElementById("formula");
  let s = best.className.toLowerCase();

  if(best.probability > 0.75){
    if(s.includes("circle")) f.innerHTML = "✅ CIRCLE DETECTED<br><br>Area = π × r × r<br>Perimeter = 2 × π × r";
    else if(s.includes("square")) f.innerHTML = "✅ SQUARE DETECTED<br><br>Area = Side × Side<br>Perimeter = 4 × Side";
    else if(s.includes("rect")) f.innerHTML = "✅ RECTANGLE DETECTED<br><br>Area = Length × Breadth<br>Perimeter = 2×(L+B)";
    else if(s.includes("tri")) f.innerHTML = "✅ TRIANGLE DETECTED<br><br>Area = ½ × Base × Height<br>Perimeter = S1+S2+S3";
    else f.innerHTML = "⚠️ NO 2D SHAPE";
  } else {
    f.innerHTML = "Shape ko camera ke paas lao...";
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
