<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Learning Portal - Poonam Sachdeva</title>
<script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>
<style>
body{font-family:'Segoe UI', sans-serif; background:#f0f8ff; margin:0; padding:0; text-align:center}
.header{background:linear-gradient(90deg,#6a11cb,#2575fc); color:white; padding:20px; border-radius:0 0 20px 20px}
.grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:15px; padding:20px; max-width:900px; margin:auto}
.card{background:white; border-radius:20px; padding:20px; box-shadow:0 4px 15px rgba(0,0,0,0.1); cursor:pointer; transition:0.3s; font-weight:bold; font-size:16px; border-bottom:5px solid #ddd}
.card:hover{transform:translateY(-5px); box-shadow:0 8px 20px rgba(0,0,0,0.15)}
.icon{font-size:40px; display:block; margin-bottom:8px}
.back-btn{background:#ff6b6b; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer; margin:15px; font-size:14px}
.folder{background:#fffde7; border:2px dashed #ffb300}
.activity{background:#e8f5e9; border-bottom-color:#4caf50}
video{width:90%; max-width:400px; border-radius:15px; margin-top:10px; border:4px solid #2575fc}
#result{font-size:22px; font-weight:bold; margin:15px; color:#2e7d32; background:white; padding:10px; border-radius:10px; display:inline-block}
#formula{background:white; max-width:400px; margin:10px auto; padding:15px; border-radius:10px; text-align:left; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
</style>
</head>
<body>
<div class="header"><h1>🌈 Smart Learning Portal</h1><p>By Poonam Sachdeva | Class 1 to 10</p></div>
<div id="app"></div>
<canvas id="canvasOutput" style="display:none"></canvas>

<script>
let currentClass = 0;
let subjects = [
  {name:"Maths", icon:"📐", color:"#ff9a9e"},
  {name:"Science", icon:"🔬", color:"#a1c4fd"},
  {name:"SST", icon:"🌍", color:"#fbc2eb"},
  {name:"English", icon:"📚", color:"#84fab0"},
  {name:"Punjabi", icon:"📝", color:"#ffecd2"},
  {name:"Hindi", icon:"✏️", color:"#d4fc79"}
];
let classIcons = ["🎈","🎒","📘","🎨","🚀","🌟","🎯","🏆","💡","🎓"];

function showClasses(){
 let html = `<h2>Select Your Class</h2><div class="grid">`;
 for(let i=1; i<=10; i++){
   html += `<div class="card" style="border-bottom-color:${i>=5?'#6a11cb':'#2575fc'}" onclick="showSubjects(${i})"><span class="icon">${classIcons[i-1]}</span>Class ${i}</div>`;
 }
 html+=`</div>`;
 document.getElementById('app').innerHTML = html;
}

function showSubjects(cls){
 currentClass = cls;
 let html = `<button class="back-btn" onclick="showClasses()">⬅ Back to Classes</button><h2>Class ${cls} - Subjects</h2><div class="grid">`;
 subjects.forEach(s=>{
   html += `<div class="card" style="border-bottom-color:${s.color}" onclick="openSubject('${s.name}')"><span class="icon">${s.icon}</span>${s.name}</div>`;
 });
 html+=`</div>`;
 document.getElementById('app').innerHTML = html;
}

function openSubject(sub){
 if(sub!== 'Maths'){
   document.getElementById('app').innerHTML = `<button class="back-btn" onclick="showSubjects(${currentClass})">⬅ Back</button><h2>Class ${currentClass} - ${sub}</h2><p>Activities Coming Soon...</p>`;
   return;
 }
 if(currentClass >= 5) openMathsFolder();
 else document.getElementById('app').innerHTML = `<button class="back-btn" onclick="showSubjects(${currentClass})">⬅ Back</button><h2>Class ${currentClass} - Maths</h2><p>Junior Classes ke liye basic activities jaldi ayengi...</p>`;
}

function openMathsFolder(){
 document.getElementById('app').innerHTML = `<button class="back-btn" onclick="showSubjects(${currentClass})">⬅ Back</button><h2>Class ${currentClass} - Maths</h2><div class="grid"><div class="card folder" onclick="openActivitiesFolder()"><span class="icon">📁</span>Maths Activities Folder<br><small>Click to Open</small></div></div>`;
}

function openActivitiesFolder(){
 document.getElementById('app').innerHTML = `<button class="back-btn" onclick="openMathsFolder()">⬅ Back to Maths</button><h2>Class ${currentClass} - Maths Activities</h2><div class="grid"><div class="card activity" onclick="openShapeDetector()"><span class="icon">📐</span>2D Shape Detector<br><small>Area & Perimeter</small></div><div class="card activity" onclick="alert('Jaldi ayega!')"><span class="icon">➕</span>More Activities</div></div>`;
}

function openShapeDetector(){
 document.getElementById('app').innerHTML = `<button class="back-btn" onclick="openActivitiesFolder()">⬅ Back to Activities</button><h2>📐 2D Shape Detector - Class ${currentClass}</h2><button onclick="startCamera()" style="padding:12px 20px;background:#2575fc;color:white;border:none;border-radius:10px;cursor:pointer">📷 Start Camera</button><br><video id="video" autoplay playsinline></video><div id="result">Camera ON karke White Paper par Black Shape dikhao</div><div id="formula"></div>`;
}

let video, streaming=false;
async function startCamera(){
 video = document.getElementById('video');
 try{
   const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
   video.srcObject = stream;
   video.onloadedmetadata = ()=>{ video.play(); if(!streaming) startDetect(); };
 }catch(e){ alert("Camera permission de do"); }
}

function startDetect(){
 streaming = true;
 let cap = new cv.VideoCapture(video);
 let src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
 let gray = new cv.Mat();
 let blur = new cv.Mat();
 let thresh = new cv.Mat();
 let contours = new cv.MatVector();
 let hierarchy = new cv.Mat();

 function process(){
   if(!document.getElementById('video')) { streaming=false; return; }
   try{
     cap.read(src);
     cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
     cv.GaussianBlur(gray, blur, new cv.Size(5,5), 0);
     cv.threshold(blur, thresh, 100, 255, cv.THRESH_BINARY_INV);
     cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
     let maxArea = 0; let shape = "No Shape";
     for(let i=0; i<contours.size(); i++){
       let cnt = contours.get(i);
       let area = cv.contourArea(cnt);
       if(area > 5000 && area > maxArea){
         maxArea = area;
         let approx = new cv.Mat();
         let peri = cv.arcLength(cnt, true);
         cv.approxPolyDP(cnt, approx, 0.04*peri, true);
         if(approx.rows == 3) shape = "Triangle 🔺";
         else if(approx.rows == 4) {
            let rect = cv.boundingRect(cnt);
            let ar = rect.width/rect.height;
            shape = (ar>0.9 && ar<1.1)? "Square ⬜" : "Rectangle ▭";
         } else if(approx.rows > 6) shape = "Circle ⭕";
         else shape = "Polygon";
         approx.delete();
       }
       cnt.delete();
     }
     if(maxArea>0) showResult(shape);
   }catch(err){}
   if(streaming) requestAnimationFrame(process);
 }
 requestAnimationFrame(process);
}

function showResult(r){
 const formulas = {
   "Circle ⭕": "<b>Circle</b><br>Area = πr²<br>Perimeter = 2πr",
   "Square ⬜": "<b>Square</b><br>Area = side²<br>Perimeter = 4 × side",
   "Rectangle ▭": "<b>Rectangle</b><br>Area = l × b<br>Perimeter = 2(l+b)",
   "Triangle 🔺": "<b>Triangle</b><br>Area = ½ × b × h<br>Perimeter = a+b+c",
   "Polygon": "<b>Polygon</b><br>Shape detected"
 };
 if(document.getElementById('result')){
   document.getElementById('result').innerText = "Detected: " + r;
   document.getElementById('formula').innerHTML = formulas[r] || "";
 }
}

showClasses();
</script>
</body>
</html>
