<!DOCTYPE html>
<html>
<head>
    <title>Smart Learning Portal - Class 1 to 10</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Poppins', sans-serif; margin:0; background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); min-height:100vh;}
        header{background: linear-gradient(90deg, #4a6cf7, #6a3de8); color:white; padding:25px; text-align:center;}
       .container{padding:25px; max-width:1100px; margin:auto;}
        h2{color:#333; text-align:center; margin-bottom:20px;}
       .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:20px;}
       .card{background:white; padding:22px 15px; text-align:center; border-radius:18px; cursor:pointer; box-shadow:0 6px 15px rgba(0,0,0,0.08); font-weight:600; transition: all 0.3s ease; border:2px solid transparent;}
       .card:hover{transform:translateY(-8px); box-shadow:0 12px 25px rgba(0,0,0,0.15);}
       .card.icon{font-size:42px; display:block; margin-bottom:10px;}
       .class-card{background: linear-gradient(135deg, #ffffff 0%, #f6f8ff 100%); color:#4a6cf7; font-size:18px; border-bottom:4px solid #4a6cf7;}
       .class-card:hover{background: linear-gradient(135deg, #4a6cf7, #6a3de8); color:white;}
       .subject-card{color:white; border:none;}
       .sub-maths{background: linear-gradient(135deg, #FF9A8B, #FF6A88);}
       .sub-science{background: linear-gradient(135deg, #43cea2, #185a9d);}
       .sub-english{background: linear-gradient(135deg, #f6d365, #fda085);}
       .sub-hindi{background: linear-gradient(135deg, #a18cd1, #fbc2eb); color:#333;}
       .sub-punjabi{background: linear-gradient(135deg, #84fab0, #8fd3f4); color:#333;}
       .sub-sst{background: linear-gradient(135deg, #fccb90, #d57eeb);}
       .activity-card{background: linear-gradient(135deg, #ffffff, #fff9c4); border:2px dashed #ffc107; color:#333;}
       .activity-card:hover{background:#ffc107; color:#000;}
       .back-btn{background:#333; color:white; border:none; padding:10px 18px; border-radius:20px; cursor:pointer; margin-bottom:20px;}
       .hidden{display:none;}
        #webcam-container canvas{border:5px solid #4a6cf7; border-radius:15px; max-width:100%;}
        #formula{background:#ffff99; border:3px solid #333; padding:15px; margin:15px auto; width:90%; max-width:500px; font-size:20px; font-weight:bold; border-radius:12px;}
        #label{font-size:22px; color:#4a6cf7; font-weight:bold; margin:15px;}
       .start-btn{padding:14px 28px; background: linear-gradient(90deg, #00c853, #009624); color:white; font-size:18px; border:none; border-radius:30px; cursor:pointer; font-weight:700;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
</head>
<body>
<header><h1>🌟 Smart Learning Portal 🌟</h1><p>Class 1 to 10 - Learn with Fun</p></header>
<div class="container">
    <div id="page-classes"><h2>📚 Select Your Class 📚</h2><div class="grid" id="class-grid"></div></div>
    <div id="page-subjects" class="hidden">
        <button class="back-btn" onclick="showPage('page-classes')">← Back</button>
        <h2 id="class-title">Subjects</h2>
        <div class="grid">
            <div class="card subject-card sub-maths" onclick="openSubject('Maths')"><span class="icon">🔢</span>Maths</div>
            <div class="card subject-card sub-science" onclick="openSubject('Science')"><span class="icon">🔬</span>Science</div>
            <div class="card subject-card sub-english" onclick="openSubject('English')"><span class="icon">🔤</span>English</div>
            <div class="card subject-card sub-hindi" onclick="openSubject('Hindi')"><span class="icon">📖</span>Hindi</div>
            <div class="card subject-card sub-punjabi" onclick="openSubject('Punjabi')"><span class="icon">📝</span>Punjabi</div>
            <div class="card subject-card sub-sst" onclick="openSubject('SST')"><span class="icon">🌍</span>SST</div>
        </div>
    </div>
    <div id="page-maths-activities" class="hidden">
        <button class="back-btn" onclick="showPage('page-subjects')">← Back</button>
        <h2 id="maths-title">Maths Activities</h2>
        <div class="grid">
            <div class="card activity-card" onclick="showPage('page-maths-model')"><span class="icon">📷</span>2D Shape Detector</div>
            <div class="card activity-card"><span class="icon">🎮</span>Addition Game</div>
        </div>
    </div>
    <div id="page-maths-model" class="hidden" style="text-align:center;">
        <button class="back-btn" onclick="stopCamera(); showPage('page-maths-activities')" style="float:left;">← Back</button>
        <div style="clear:both;"></div>
        <h2>🔷 Shape Detector 🔶</h2>
        <button class="start-btn" onclick="init()">▶ Start Camera</button>
        <div id="webcam-container" style="margin-top:15px;"></div>
        <div id="label"></div>
        <div id="formula">Start dabao fir shape dikhao</div>
    </div>
</div>
<script>
    const classGrid = document.getElementById('class-grid');
    const classIcons = ["🎈","🌈","⭐","🎨","🚀","📚","🎯","💡","🏆","🎓"];
    for(let i=1; i<=10; i++){
        let div = document.createElement('div');
        div.className = 'card class-card';
        div.innerHTML = `<span class="icon">${classIcons[i-1]}</span>Class ${i}`;
        div.onclick = () => selectClass(i);
        classGrid.appendChild(div);
    }
    function selectClass(c){
        document.getElementById('class-title').innerText = `Class ${c} - Choose Subject`;
        document.getElementById('maths-title').innerText = `Class ${c} - Maths Activities`;
        showPage('page-subjects');
    }
    function openSubject(sub){ if(sub === 'Maths'){ showPage('page-maths-activities'); } else { alert(sub + ' - Coming Soon!'); } }
    function showPage(id){
        document.getElementById('page-classes').classList.add('hidden');
        document.getElementById('page-subjects').classList.add('hidden');
        document.getElementById('page-maths-activities').classList.add('hidden');
        document.getElementById('page-maths-model').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }
    const URL = "https://teachablemachine.withgoogle.com/models/bFbw77Ikk/";
    let model, webcam, loopRunning = false;
    async function init(){
      model = await tmImage.load(URL+"model.json", URL+"metadata.json");
      webcam = new tmImage.Webcam(350,350,true);
      await webcam.setup(); await webcam.play();
      document.getElementById("webcam-container").innerHTML = "";
      document.getElementById("webcam-container").appendChild(webcam.canvas);
      loopRunning = true; loop();
    }
    async function loop(){
      if(!loopRunning) return;
      webcam.update();
      const prediction = await model.predict(webcam.canvas);
      let best = prediction[0];
      for(let p of prediction) if(p.probability > best.probability) best = p;
      let per = (best.probability*100).toFixed(0);
      document.getElementById("label").innerHTML = best.className.toUpperCase()+" : "+per+"%";
      let f = document.getElementById("formula");
      let s = best.className.toLowerCase();
      if(best.probability > 0.75){
        if(s.includes("circle")) f.innerHTML = "✅ CIRCLE DETECTED<br><br>Area = π × r × r<br>Perimeter = 2 × π × r";
        else if(s.includes("square")) f.innerHTML = "✅ SQUARE DETECTED<br><br>Area = Side × Side<br>Perimeter = 4 × Side";
        else if(s.includes("rect")) f.innerHTML = "✅ RECTANGLE DETECTED<br><br>Area = Length × Breadth<br>Perimeter = 2×(L+B)";
        else if(s.includes("tri")) f.innerHTML = "✅ TRIANGLE DETECTED<br><br>Area = ½ × Base × Height<br>Perimeter = S1+S2+S3";
        else f.innerHTML = "⚠️ NO 2D SHAPE";
      } else { f.innerHTML = "Shape ko camera ke paas lao..."; }
      requestAnimationFrame(loop);
    }
    function stopCamera(){ loopRunning = false; if(webcam) webcam.stop(); }
</script>
</body>
</html>
